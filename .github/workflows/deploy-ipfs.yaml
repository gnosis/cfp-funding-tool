name: Deploy to IPFS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy (default: current ref)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install yarn for caching
        run: |
          # Install yarn globally via npm (required for setup-node caching)
          # setup-node requires the package manager to be available before caching
          if ! command -v yarn >/dev/null 2>&1; then
            echo "Installing yarn via npm..."
            npm install -g yarn
            echo "✅ Yarn installed"
          else
            echo "✅ Yarn already available"
          fi
          yarn --version

      - name: Setup Node.js cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          VITE_WEB_API_URL: ${{ secrets.VITE_WEB_API_URL || vars.VITE_WEB_API_URL }}
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ github.sha }}
          path: dist
          if-no-files-found: error

  deploy-ipfs:
      needs: [build]
      uses: gnosis/gh-action-pinata/.github/workflows/pinata-deployment.yml@6197bbf8ffd6bee0d4ddb633af27633ca80a6a26 # 0.2.0
      with:
        environment: prod
        project_name: cfp-funding-tool
        build_dir: dist
        build_artifact_name: build-${{ github.sha }}
      secrets:
        PINATA_JWT: ${{ secrets.PINATA_JWT }}

  propose-ens:
    needs: [build, deploy-ipfs]
    if: ${{ inputs.propose_ens }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    steps:
      - name: Propose ENS contenthash update
        uses: hoprnet/hopr-workflows/actions/propose-ens-contenthash@b705e6ea5d876087e98307c76a12b821e38f030e # propose-ens-contenthash
        with:
          CID: ${{ needs.deploy-ipfs.outputs.ipfs_hash }}
          ENS_NAME: ${{ vars.ENS_NAME }}
          RESOLVER_ADDRESS: ${{ vars.RESOLVER_ADDRESS }}
          SAFE_ADDRESS: ${{ vars.SAFE_ADDRESS }}
          ENS_DELEGATE_PRIVATE_KEY: ${{ secrets.ENS_DELEGATE_PRIVATE_KEY }}
          SAFE_API_KEY: ${{ secrets.SAFE_API_KEY }}
          TX_ORIGIN: 'gnosis_vpn-docs/deploy' 
